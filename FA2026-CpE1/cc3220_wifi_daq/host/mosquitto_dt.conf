# Mosquitto broker for the bridge digital twin, stage 1 (plain MQTT).
#
# Only for the isolated project network: no password, no TLS. Stage 2 adds TLS.
#
# Run in the foreground from this folder (Windows PowerShell):
#   & 'C:\Program Files\mosquitto\mosquitto.exe' -c mosquitto_dt.conf -v

listener 1883 0.0.0.0
allow_anonymous true
persistence false

# 1 MB is far above the ~5 KB packets; anything larger is not ours.
message_size_limit 1048576

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
