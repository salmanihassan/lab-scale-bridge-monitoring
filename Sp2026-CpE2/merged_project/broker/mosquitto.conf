# --- TLS Listener (primary) ---
listener 8883 0.0.0.0
cafile certs/ca-cert.pem
certfile certs/server.crt
keyfile certs/server.key
tls_version tlsv1.2
ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA
allow_anonymous true

# --- Plaintext Listener (debug fallback -- remove for production) ---
listener 1883 0.0.0.0
allow_anonymous true
